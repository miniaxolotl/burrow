version: 2

project_name: burrow

before:
  hooks:
    - go work sync

builds:
  - id: burrowd
    mod_timestamp: "{{ .CommitTimestamp }}"
    dir: burrowd
    binary: burrowd
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X main.Version={{.Version}}
      - -X main.Revision={{.FullCommit}}
      - -X main.TelemetryBuild={{.Env.BURROW_TELEMETRY_BUILD}}
      - -X main.PostHogKey={{.Env.BURROW_POSTHOG_KEY}}
      - -X main.SentryDSN={{.Env.BURROW_SERVER_SENTRY_DSN}}

  - id: burrowctl
    mod_timestamp: "{{ .CommitTimestamp }}"
    dir: burrowctl
    binary: burrowctl
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X main.Version={{.Version}}
      - -X main.Revision={{.FullCommit}}
      - -X main.TelemetryBuild={{.Env.BURROW_TELEMETRY_BUILD}}
      - -X main.PostHogKey={{.Env.BURROW_POSTHOG_KEY}}
      - -X main.SentryDSN={{.Env.BURROW_CLI_SENTRY_DSN}}

archives:
  - id: burrowd
    ids: [burrowd]
    name_template: "burrowd_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    wrap_in_directory: false

  - id: burrowctl
    ids: [burrowctl]
    name_template: "burrowctl_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    wrap_in_directory: false

checksum:
  name_template: checksums.txt
  algorithm: sha256

release:
  github:
    owner: miniaxolotl
    name: burrow
  draft: false
  prerelease: auto

changelog:
  disable: true # Release Please owns the release body and CHANGELOG.md.
