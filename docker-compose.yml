services:
  burrowd:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    command: >
      serve
      --port ${BURROW_PORT:-25701}
      --domain ${BURROW_DOMAIN:-localhost}
      --redis-url ${BURROW_REDIS_URL:-redis://redis:6379}
      --secret ${BURROW_SECRET}
    ports:
      - "${BURROW_PORT:-25701}:${BURROW_PORT:-25701}"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - burrow-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:${BURROW_PORT:-25701}/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - burrow-net
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

networks:
  burrow-net:
    driver: bridge

volumes:
  redis_data:
