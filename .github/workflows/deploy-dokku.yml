name: Deploy to Dokku

on:
  push:
    branches: [development, production]

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/development'
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: dokku/github-action@master
        with:
          git_remote_url: ${{ secrets.DOKKU_GIT_REMOTE_URL_PREVIEW }}
          ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY }}
          ssh_host_key: ${{ secrets.DOKKU_SSH_HOST_KEY }}
          branch: main

  deploy-production:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/production'
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Unlock app if locked
        run: |
          sshopts="-o StrictHostKeyChecking=no"
          ssh $sshopts ${{ secrets.DOKKU_SSH_HOST_KEY }} "dokku apps:unlock burrowd" 2>/dev/null || true
      - uses: dokku/github-action@master
        with:
          git_remote_url: ${{ secrets.DOKKU_GIT_REMOTE_URL }}
          ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY }}
          ssh_host_key: ${{ secrets.DOKKU_SSH_HOST_KEY }}
          branch: main
