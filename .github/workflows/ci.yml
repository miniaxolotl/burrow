name: CI

on:
  push:
    branches: [development, production]
  pull_request:
    branches: [development, production]
  workflow_dispatch:
    inputs:
      promotion_pr:
        description: Frozen promotion PR number (omit for source CI)
        type: string
        default: ""

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.merge_group.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  changes:
    name: Change Classification
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      selection: ${{ steps.classify.outputs.selection }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.21.0"
      - id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PROMOTION_PR: ${{ inputs.promotion_pr }}
        run: node scripts/ci/selection.mjs classify

  promotion:
    name: Promotion Admission
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.21.0"
      - name: Lint GitHub Actions workflows
        run: bash scripts/ci/run-actionlint.sh
      - run: node --test scripts/ci/*.test.mjs scripts/release/promotion.test.mjs
      - run: node scripts/release/promotion.mjs admit
        env:
          GH_TOKEN: ${{ github.token }}

  ci-gate:
    name: CI Gate
    if: always()
    needs: [changes, promotion, infrastructure, website, lint, build, test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.21.0"
      - env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: node scripts/ci/selection.mjs gate

  infrastructure:
    name: Infrastructure Quality
    needs: changes
    if: ${{ !cancelled() && needs.changes.result == 'success' && fromJSON(needs.changes.outputs.selection).infrastructure }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: "1.12.6"
          tofu_wrapper: false
      - run: bash scripts/infra/check.sh
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          build-args: VERSION=ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  website:
    name: Website
    needs: changes
    if: ${{ !cancelled() && needs.changes.result == 'success' && fromJSON(needs.changes.outputs.selection).website }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_ENV: production
      NEXT_PUBLIC_POSTHOG_ENABLED: "true"
      NEXT_PUBLIC_POSTHOG_KEY: phc_playwright_only
      NEXT_PUBLIC_SENTRY_ENABLED: "true"
      NEXT_PUBLIC_SENTRY_DSN: https://00000000000000000000000000000000@o0.ingest.us.sentry.io/1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0; pnpm 10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.21.0"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: browser-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: browser-${{ runner.os }}-${{ runner.arch }}-node24-${{ hashFiles('pnpm-lock.yaml') }}
      - id: build-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/website/.next/cache
          key: next-${{ runner.os }}-${{ runner.arch }}-node24-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: next-${{ runner.os }}-${{ runner.arch }}-node24-${{ hashFiles('pnpm-lock.yaml') }}-
      - run: node --test scripts/release/*.test.mjs
      - run: pnpm lint:website
      - run: pnpm typecheck:website
      - run: pnpm --filter website exec tsc --noEmit --module NodeNext --moduleResolution NodeNext --target ES2022 ../../scripts/release/src/index.ts
      - run: pnpm build:website
      - run: pnpm --filter website exec playwright install --with-deps chromium
      - run: pnpm --filter website test
      - if: ${{ github.event_name != 'pull_request' && github.ref_protected && steps.browser-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.browser-cache.outputs.cache-primary-key }}
      - if: ${{ github.event_name != 'pull_request' && github.ref_protected && steps.build-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/website/.next/cache
          key: ${{ steps.build-cache.outputs.cache-primary-key }}

  lint:
    name: Go Quality
    needs: changes
    if: ${{ !cancelled() && needs.changes.result == 'success' && fromJSON(needs.changes.outputs.selection).lint }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: burrowd/go.mod
          cache: true
          cache-dependency-path: "**/go.sum"
      - run: go vet ./burrowd/... ./burrowctl/... ./protocol/...

  build:
    name: Go Build
    needs: changes
    if: ${{ !cancelled() && needs.changes.result == 'success' && fromJSON(needs.changes.outputs.selection).build }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: burrowd/go.mod
          cache: true
          cache-dependency-path: "**/go.sum"
      - run: go work sync
      - run: go build ./burrowd/... ./burrowctl/... ./protocol/...

  test:
    name: Go Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: ${{ !cancelled() && needs.changes.result == 'success' && fromJSON(needs.changes.outputs.selection).test }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: burrowd/go.mod
          cache: true
          cache-dependency-path: "**/go.sum"
      - run: go test ./burrowd/... ./burrowctl/... ./protocol/...
