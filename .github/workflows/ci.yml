name: CI

on:
  push:
    branches: [production, development]
  pull_request:
    branches: [production, development]

jobs:
  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint:website
      - run: pnpm typecheck:website
      - run: pnpm build:website

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: burrowd/go.mod
          cache: true
          cache-dependency-path: '**/go.sum'
      - run: go vet ./burrowd/... ./burrowctl/... ./protocol/...

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: burrowd/go.mod
          cache: true
          cache-dependency-path: '**/go.sum'
      - run: go work sync
      - run: go build ./burrowd/... ./burrowctl/... ./protocol/...

  test:
    runs-on: ubuntu-latest
    needs: [lint, build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: burrowd/go.mod
          cache: true
          cache-dependency-path: '**/go.sum'
      - run: go test ./burrowd/... ./burrowctl/... ./protocol/...
