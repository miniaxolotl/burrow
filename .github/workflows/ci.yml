name: CI

on:
  push:
    branches: [production, development]
  pull_request:
    branches: [production, development]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: burrowd/go.mod
          cache: true
          cache-dependency-path: '**/go.sum'
      - run: go vet ./burrowd/... ./burrowctl/... ./protocol/...

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: burrowd/go.mod
          cache: true
          cache-dependency-path: '**/go.sum'
      - run: go work sync
      - run: go build ./burrowd/... ./burrowctl/... ./protocol/...

  test:
    runs-on: ubuntu-latest
    needs: [lint, build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: burrowd/go.mod
          cache: true
          cache-dependency-path: '**/go.sum'
      - run: go test ./burrowd/... ./burrowctl/... ./protocol/...
