name: CI

on:
  push:
    branches: [production, development]
  pull_request:
    branches: [production, development]
  workflow_dispatch:
    inputs:
      promotion_pr:
        description: Frozen promotion PR number (automation only; omit for source CI)
        type: string
        default: ""

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  promotion:
    name: Promotion Admission
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
      - run: node --test scripts/release/*.test.mjs
      - run: node scripts/release/promotion.mjs admit
        env:
          GH_TOKEN: ${{ github.token }}

  gate:
    name: CI Gate
    if: always()
    needs: [promotion, infrastructure, website, lint, build, test]
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success")' <<< "$RESULTS"

  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: "1.12.6"
          tofu_wrapper: false
      - run: bash scripts/infra/check.sh
      - uses: actions/setup-go@v5
        with:
          go-version-file: burrowd/go.mod
          cache-dependency-path: "**/go.sum"
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.11
      - run: docker build --build-arg VERSION=ci -t burrowd:ci .

  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint:website
      - run: pnpm typecheck:website
      - run: pnpm --filter website exec tsc --noEmit --module NodeNext --moduleResolution NodeNext --target ES2022 ../../scripts/release/src/index.ts
      - run: pnpm build:website

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: burrowd/go.mod
          cache: true
          cache-dependency-path: "**/go.sum"
      - run: go vet ./burrowd/... ./burrowctl/... ./protocol/...

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: burrowd/go.mod
          cache: true
          cache-dependency-path: "**/go.sum"
      - run: go work sync
      - run: go build ./burrowd/... ./burrowctl/... ./protocol/...

  test:
    runs-on: ubuntu-latest
    needs: [lint, build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: burrowd/go.mod
          cache: true
          cache-dependency-path: "**/go.sum"
      - run: go test ./burrowd/... ./burrowctl/... ./protocol/...
