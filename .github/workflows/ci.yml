name: CI

on:
  push:
    branches: [development, production]
  pull_request:
    branches: [development, production]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: burrowd/go.mod
          cache: true
      - run: |
          go vet ./burrowd/... ./burrowctl/... ./protocol/...

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: burrowd/go.mod
          cache: true
      - run: |
          go build ./burrowd/... ./burrowctl/... ./protocol/...

  test:
    runs-on: ubuntu-latest
    needs: [lint, build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: burrowd/go.mod
          cache: true
      - run: |
          go test ./burrowd/... ./burrowctl/... ./protocol/...

  deploy-preview:
    runs-on: ubuntu-24.04
    needs: [test]
    if: github.ref == 'refs/heads/development' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dokku/github-action@master
        with:
          git_remote_url: ${{ secrets.DOKKU_GIT_REMOTE_URL_PREVIEW }}
          ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY }}
          branch: main

  deploy-production:
    runs-on: ubuntu-24.04
    needs: [test]
    if: github.ref == 'refs/heads/production' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dokku/github-action@master
        with:
          git_remote_url: ${{ secrets.DOKKU_GIT_REMOTE_URL }}
          ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY }}
          branch: main
