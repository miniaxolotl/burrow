name: Source Release
on:
  push:
    branches: [development]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-please-development
  cancel-in-progress: false
jobs:
  release-please:
    if: github.repository == 'miniaxolotl/burrow' && github.ref == 'refs/heads/development' && github.ref_protected == true
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.21.0"
      - name: Verify patch-first release intent
        run: node scripts/release/release-intent.mjs
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0; release-please 17.6.0
        id: release
        with:
          token: ${{ github.token }}
          target-branch: development
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - name: Explicit CI dispatch for token-authored release PRs
        if: steps.release.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PRS: ${{ steps.release.outputs.prs }}
        run: node scripts/release/dispatch-ci.mjs
      - name: Fetch immutable tags, including after an interrupted selection
        if: github.event_name == 'push' && !github.event.forced && !github.event.created && !github.event.deleted
        run: git fetch origin --tags
      - name: Prepare the frozen PR after independent source CI
        id: selection
        if: github.event_name == 'push' && !github.event.forced && !github.event.created && !github.event.deleted
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release/promotion.mjs auto
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.selection.outputs.pr != ''
        with:
          name: selected-candidate-${{ github.run_attempt }}
          path: selection.json
          retention-days: 90
          if-no-files-found: error
      - name: Dispatch CI for the frozen PR
        if: steps.selection.outputs.pr != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PROMOTION_PR: ${{ steps.selection.outputs.pr }}
        run: node scripts/release/dispatch-ci.mjs
