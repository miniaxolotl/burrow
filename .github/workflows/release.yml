name: Release

on:
  push:
    branches: [production]
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile
      - run: go work sync

      - name: Get version
        id: version
        run: echo "VERSION=$(node -p "require('./packages/burrowctl/package.json').version")" >> $GITHUB_OUTPUT

      - name: Check npm
        id: npm-check
        run: |
          if npm view @miniaxolotl/burrowctl version 2>/dev/null | grep -q "^${{ steps.version.outputs.VERSION }}$"; then
            echo "published=true" >> $GITHUB_OUTPUT
          else
            echo "published=false" >> $GITHUB_OUTPUT
          fi

      - name: Publish to npm
        if: steps.npm-check.outputs.published != 'true'
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          for PLATFORM in linux-x64 linux-arm64 darwin-x64 darwin-arm64; do
            PKG_DIR="packages/burrowctl-${PLATFORM}"
            BIN_SRC="dist/burrowctl_${PLATFORM}_amd64_v1/burrowctl"
            [ "$PLATFORM" = "linux-arm64" ] && BIN_SRC="dist/burrowctl_linux_arm64/burrowctl"
            [ "$PLATFORM" = "darwin-arm64" ] && BIN_SRC="dist/burrowctl_darwin_arm64/burrowctl"
            cp "$BIN_SRC" "$PKG_DIR/burrowctl"
            chmod +x "$PKG_DIR/burrowctl"
            node -e "
              const fs = require('fs');
              const pkg = JSON.parse(fs.readFileSync('${PKG_DIR}/package.json'));
              pkg.version = '${VERSION}';
              fs.writeFileSync('${PKG_DIR}/package.json', JSON.stringify(pkg, null, 2) + '\n');
            "
            cd "$PKG_DIR" && pnpm publish --access public
            echo "✓ Published @miniaxolotl/burrowctl-${PLATFORM}@${VERSION}"
          done
          MAIN_DIR="packages/burrowctl"
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('${MAIN_DIR}/package.json'));
            pkg.version = '${VERSION}';
            for (const dep of Object.keys(pkg.optionalDependencies)) {
              pkg.optionalDependencies[dep] = '${VERSION}';
            }
            fs.writeFileSync('${MAIN_DIR}/package.json', JSON.stringify(pkg, null, 2) + '\n');
          "
          cd "$MAIN_DIR" && pnpm publish --access public
          echo "✓ Published @miniaxolotl/burrowctl@${VERSION}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub release
        run: |
          TAG="v${{ steps.version.outputs.VERSION }}"
          if gh release view "$TAG" --repo "${{ github.repository }}" 2>/dev/null; then
            echo "Release $TAG already exists"
          else
            gh release create "$TAG" \
              --title "Release $TAG" \
              --generate-notes \
              --repo "${{ github.repository }}"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
