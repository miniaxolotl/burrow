name: deploy

on:
  push:
    branches: [development, production]
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  dokku:
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Unlock app if locked
        if: github.ref == 'refs/heads/production'
        run: |
          sshopts="-o StrictHostKeyChecking=no"
          ssh $sshopts ${{ secrets.DOKKU_SSH_HOST_KEY }} "dokku apps:unlock burrowd" 2>/dev/null || true
      - uses: dokku/github-action@master
        with:
          git_remote_url: ${{ github.ref == 'refs/heads/production' && secrets.DOKKU_GIT_REMOTE_URL || secrets.DOKKU_GIT_REMOTE_URL_PREVIEW }}
          ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY }}
          ssh_host_key: ${{ secrets.DOKKU_SSH_HOST_KEY }}
          branch: main

  docker:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get version
        id: version
        run: echo "TAG=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Check Docker Hub credentials
        id: dockerhub
        run: |
          if [ -n "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "available=true" >> $GITHUB_OUTPUT
          else
            echo "available=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: steps.dockerhub.outputs.available == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/miniaxolotl/burrowd:latest
            ghcr.io/miniaxolotl/burrowd:${{ steps.version.outputs.TAG }}
            ${{ steps.dockerhub.outputs.available == 'true' && format('miniaxolotl/burrowd:latest,miniaxolotl/burrowd:{0}', steps.version.outputs.TAG) || '' }}
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.TAG }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
