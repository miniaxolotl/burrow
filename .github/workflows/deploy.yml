name: Deploy

on:
  push:
    branches: [development, production]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to deploy (e.g., 0.2.6) — leave empty for dev deploy"
        required: false
        default: ""

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Resolve tags
        id: meta
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [ "${{ github.ref_name }}" = "production" ]; then
            VERSION=$(node -p "require('./package.json').version")
          fi

          if [ -n "$VERSION" ]; then
            echo "TAGS<<EOF" >> $GITHUB_OUTPUT
            echo "ghcr.io/miniaxolotl/burrowd:latest" >> $GITHUB_OUTPUT
            echo "ghcr.io/miniaxolotl/burrowd:v${VERSION}" >> $GITHUB_OUTPUT
            echo "miniaxolotl/burrowd:latest" >> $GITHUB_OUTPUT
            echo "miniaxolotl/burrowd:v${VERSION}" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
            echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          else
            echo "TAGS<<EOF" >> $GITHUB_OUTPUT
            echo "ghcr.io/miniaxolotl/burrowd:dev" >> $GITHUB_OUTPUT
            echo "miniaxolotl/burrowd:dev" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
            echo "VERSION=dev" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.meta.outputs.VERSION }}
          tags: ${{ steps.meta.outputs.TAGS }}
          labels: |
            org.opencontainers.image.version=${{ steps.meta.outputs.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
