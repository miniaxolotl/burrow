name: Deploy
on:
  push:
    branches: [production]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pull-requests: read
concurrency:
  group: production-release
  cancel-in-progress: false
jobs:
  candidate:
    if: github.ref == 'refs/heads/production'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    outputs:
      sha: ${{ steps.candidate.outputs.sha }}
      tag: ${{ steps.candidate.outputs.tag }}
      version: ${{ steps.candidate.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: Wait for complete independent production CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release/promotion.mjs wait-ci "$GITHUB_SHA"
      - id: candidate
        name: Resolve source release before any publication or deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release/promotion.mjs production "$GITHUB_SHA"

  publish:
    needs: candidate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    permissions:
      contents: write
      packages: write
      id-token: write
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_SOURCE_SHA: ${{ needs.candidate.outputs.sha }}
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.candidate.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - uses: actions/setup-go@v5
        with:
          go-version-file: burrowd/go.mod
          cache-dependency-path: "**/go.sum"
      - run: pnpm install --frozen-lockfile
      - run: npm whoami
      - name: Reject a superseded publication
        run: test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/production" --jq .object.sha)" = "$GITHUB_SHA"
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "v2.18.3"
          args: release --clean --skip=publish
      - name: Preflight every npm package and GitHub asset
        env:
          TAG: ${{ needs.candidate.outputs.tag }}
        run: |
          pnpm run release --dry-run
          node scripts/release/upload-assets.mjs "$TAG" --dry-run
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Resolve an existing immutable image
        id: existing
        env:
          TAG: ${{ needs.candidate.outputs.tag }}
        run: |
          inspect() {
            local digest
            if digest="$(docker buildx imagetools inspect "$1" --format '{{.Manifest.Digest}}' 2>image-error)"; then
              [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]] || return 1
              printf '%s' "$digest"
            elif ! grep -Eqi 'not found|manifest unknown|no such manifest' image-error; then
              cat image-error >&2
              return 1
            fi
          }
          digest="$(inspect "ghcr.io/miniaxolotl/burrowd:sha-$RELEASE_SOURCE_SHA")"
          version_digest="$(inspect "ghcr.io/miniaxolotl/burrowd:$TAG")"
          if [[ -n "$version_digest" && "$version_digest" != "$digest" ]]; then exit 1; fi
          for tag in "sha-$RELEASE_SOURCE_SHA" "$TAG"; do
            hub_digest="$(inspect "miniaxolotl/burrowd:$tag")"
            if [[ -n "$hub_digest" && "$hub_digest" != "$digest" ]]; then exit 1; fi
          done
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - id: build
        if: steps.existing.outputs.digest == ''
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ needs.candidate.outputs.version }}
          tags: ghcr.io/miniaxolotl/burrowd:sha-${{ needs.candidate.outputs.sha }}
          labels: |
            org.opencontainers.image.version=${{ needs.candidate.outputs.version }}
            org.opencontainers.image.revision=${{ needs.candidate.outputs.sha }}
            org.opencontainers.image.source=https://github.com/miniaxolotl/burrow
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Publish packages and release archives
        env:
          TAG: ${{ needs.candidate.outputs.tag }}
        run: |
          pnpm run release
          node scripts/release/upload-assets.mjs "$TAG"
      - id: image
        name: Promote and verify the immutable image
        env:
          DIGEST: ${{ steps.existing.outputs.digest || steps.build.outputs.digest }}
          TAG: ${{ needs.candidate.outputs.tag }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/production" --jq .object.sha)" = "$GITHUB_SHA"
          source="ghcr.io/miniaxolotl/burrowd@$DIGEST"
          docker pull "$source"
          test "$(docker inspect "$source" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "$RELEASE_SOURCE_SHA"
          for repository in ghcr.io/miniaxolotl/burrowd miniaxolotl/burrowd; do
            for tag in "sha-$RELEASE_SOURCE_SHA" "$TAG" latest; do
              docker buildx imagetools create --prefer-index=false --tag "$repository:$tag" "$source"
              test "$(docker buildx imagetools inspect "$repository:$tag" --format '{{.Manifest.Digest}}')" = "$DIGEST"
            done
          done
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          jq -n --arg sha "$RELEASE_SOURCE_SHA" --arg tag "$TAG" --arg digest "$DIGEST" \
            '{sha:$sha,tag:$tag,image:"ghcr.io/miniaxolotl/burrowd",digest:$digest}' > manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ needs.candidate.outputs.tag }}-${{ github.run_attempt }}
          path: manifest.json

  infrastructure:
    needs: [candidate, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    concurrency:
      group: infra-production
      cancel-in-progress: false
    env:
      PG_CONN_STR: ${{ secrets.OPENTOFU_STATE_DATABASE_URL }}
      TF_ENCRYPTION: ${{ secrets.OPENTOFU_STATE_ENCRYPTION }}
      DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      UPSTASH_EMAIL: ${{ secrets.UPSTASH_EMAIL }}
      UPSTASH_API_KEY: ${{ secrets.UPSTASH_API_KEY }}
      TF_VAR_image_digest: ${{ needs.publish.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.candidate.outputs.sha }}
          persist-credentials: false
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: "1.12.6"
          tofu_wrapper: false
      - name: Reject a superseded production operation
        env:
          GH_TOKEN: ${{ github.token }}
        run: test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/production" --jq .object.sha)" = "$GITHUB_SHA"
      - run: bash scripts/infra/apply.sh production
      - uses: actions/setup-go@v5
        with:
          go-version-file: burrowctl/go.mod
          cache-dependency-path: "**/go.sum"
      - name: Verify real HTTPS tunnel forwarding
        run: BURROW_SMOKE_SERVER=brmbl.dev go test ./burrowctl/internal -run TestLiveTunnel -count=1 -v
