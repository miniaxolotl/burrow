name: Infrastructure Maintenance
on:
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        environment: [staging, production]
    environment: ${{ matrix.environment }}
    concurrency:
      group: infra-${{ matrix.environment }}
      cancel-in-progress: false
    env:
      PG_CONN_STR: ${{ secrets.OPENTOFU_STATE_DATABASE_URL }}
      TF_ENCRYPTION: ${{ secrets.OPENTOFU_STATE_ENCRYPTION }}
      DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      UPSTASH_EMAIL: ${{ secrets.UPSTASH_EMAIL }}
      UPSTASH_API_KEY: ${{ secrets.UPSTASH_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.environment == 'production' && 'production' || 'development' }}
          persist-credentials: false
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: "1.12.6"
          tofu_wrapper: false
      - name: Reconcile DNS and certificate verification
        env:
          TARGET: ${{ matrix.environment }}
        run: bash scripts/infra/apply.sh "$TARGET"
