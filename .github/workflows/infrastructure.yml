name: Infrastructure Maintenance
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reconcile:
    if: github.ref == 'refs/heads/production'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    concurrency:
      group: infra-production
      cancel-in-progress: false
    env:
      PG_CONN_STR: ${{ secrets.OPENTOFU_STATE_DATABASE_URL }}
      TF_ENCRYPTION: ${{ secrets.OPENTOFU_STATE_ENCRYPTION }}
      DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      UPSTASH_EMAIL: ${{ secrets.UPSTASH_EMAIL }}
      UPSTASH_API_KEY: ${{ secrets.UPSTASH_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: "1.12.6"
          tofu_wrapper: false
      - name: Reconcile DNS and certificate verification
        run: bash scripts/infra/apply.sh production
